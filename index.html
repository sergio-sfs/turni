<style>

<header>🗓️ Turni <small id="ver"></small></header><div id="view"></div>
<nav><button data-tab="plan">📅<br>Piano</button><button data-tab="ov">🗂️<br>Panoramica</button><button data-tab="set">⚙️<br>Impostazioni</button><button data-tab="exp">📤<br>Esporta</button></nav>
<div id="sheet"></div><div id="toast"></div><div id="print"></div>
<script>
'use strict';
const APP_VERSION='1.2.0';
const DAYN=['Lu','Ma','Me','Gi','Ve','Sa','Do'];
const DAYF=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const pad=n=>String(n).padStart(2,'0');
const m2t=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const t2m=t=>{const p=String(t).split(':').map(Number);return (p[0]||0)*60+(p[1]||0);};
const dur=m=>Math.floor(m/60)+':'+pad(((m%60)+60)%60);
function dayNum(s){const p=s.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5);}
function iso(n){const d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
function ddmm(n){const d=new Date(n*864e5);return pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1);}
function ddmmyyyy(n){return ddmm(n)+'/'+new Date(n*864e5).getUTCFullYear();}
function mondayOf(n){return n-((((n+3)%7)+7)%7);}
function todayIso(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

function defaultSettings(today){
  return {
    startDate:iso(mondayOf(dayNum(today))), weeks:4,
    targetMin:1380, tolMin:0,
    minWD:5, maxWD:6, maxConsec:6, restH:11, step:15, restPref:'none', code:'190',
    positions:['Isola 2','Fastlane 2','Bazar 3 NP','Cassa Esterna','Retrocassa NP1','x-lavagna ASZ'],
    fasce:[
      {id:'M',name:'Mattina',mode:'start',from:450,to:570},
      {id:'P',name:'Pomeriggio',mode:'start',from:750,to:1050},
      {id:'C',name:'Chiusura',mode:'end',from:1260,to:1275}
    ],
    days:DAYN.map(()=>({avail:'on',durMin:180,durMax:300,from:450,to:1275,tend:1,fasce:{}})),
    vacations:[]
  };
}
const restDays=()=>Array.from({length:7},()=>({rest:true,s:null,e:null,note:'',pos:''}));
function newPlan(S){
  const b=mondayOf(dayNum(S.startDate));
  return Array.from({length:S.weeks},(_,i)=>({start:iso(b+7*i),target:null,days:restDays()}));
}
function weekTotal(w){return w.days.reduce((a,d)=>a+((d.rest||d.s==null||d.e==null)?0:Math.max(0,d.e-d.s)),0);}
function buildShifts(plan){
  const out=[];
  plan.forEach((w,wi)=>{const b=dayNum(w.start);w.days.forEach((d,di)=>{
    if(!d.rest&&d.s!=null&&d.e!=null&&d.e>d.s)out.push({wi,di,abs:b+di,s:d.s,e:d.e});});});
  return out;
}

function validate(plan,S){
  const iss=plan.map(()=>[]);
  const vac=new Set(S.vacations);
  const add=(wi,di,msg)=>iss[wi].push({di,msg});
  plan.forEach((w,wi)=>{
    const base=dayNum(w.start);let tot=0,n=0;
    w.days.forEach((d,di)=>{
      if(d.rest)return;
      const c=S.days[di];n++;
      if(d.s==null||d.e==null||d.e<=d.s){add(wi,di,'Orario non valido');return;}
      const du=d.e-d.s;tot+=du;
      if(c.avail==='rest')add(wi,di,'Giorno impostato sempre di riposo');
      if(vac.has(iso(base+di)))add(wi,di,'Giorno di ferie/indisponibilità');
      if(du<c.durMin)add(wi,di,'Turno sotto il minimo ('+dur(c.durMin)+')');
      if(du>c.durMax)add(wi,di,'Turno sopra il massimo ('+dur(c.durMax)+')');
      if(d.s<c.from||d.e>c.to)add(wi,di,'Fuori orario consentito ('+m2t(c.from)+'–'+m2t(c.to)+')');
    });
    const T=w.target==null?S.targetMin:w.target;
    if(Math.abs(tot-T)>S.tolMin)add(wi,null,'Ore '+dur(tot)+' invece di '+dur(T));
    if(n<S.minWD)add(wi,null,'Solo '+n+' giorni lavorati (min '+S.minWD+')');
    if(n>S.maxWD)add(wi,null,n+' giorni lavorati (max '+S.maxWD+')');
  });
  const sh=buildShifts(plan);
  for(let i=1;i<sh.length;i++){
    const a=sh[i-1],b=sh[i],gap=(b.abs-a.abs)*1440+b.s-a.e;
    if(gap<S.restH*60)add(b.wi,b.di,'Solo '+dur(gap)+' di riposo dal turno precedente (min '+S.restH+':00)');
  }
  let run=0,last=null;
  sh.forEach(x=>{
    if(last!==null&&x.abs===last+1)run++;else run=1;last=x.abs;
    if(run>S.maxConsec)add(x.wi,x.di,run+' giorni consecutivi (max '+S.maxConsec+')');
  });
  return iss;
}

const rnd=n=>Math.floor(Math.random()*n);
function wpick(items,wf){
  const ws=items.map(wf);let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return i;}
  return items.length-1;
}
function options(S,c,fa,d){
  const out=[],st=S.step;
  if(fa.mode==='start'){
    for(let s=Math.ceil(fa.from/st)*st;s<=fa.to;s+=st){const e=s+d;if(s>=c.from&&e<=c.to)out.push({s,e});}
  }else{
    for(let e=Math.ceil(fa.from/st)*st;e<=fa.to;e+=st){const s=e-d;if(s>=c.from&&e<=c.to)out.push({s,e});}
  }
  return out;
}
function setup(S,plan,wi){
  const w=plan[wi],base=dayNum(w.start),st=S.step;
  const T=Math.round((w.target==null?S.targetMin:w.target)/st)*st;
  const vac=new Set(S.vacations);
  const cfg=S.days.map(c=>({c,mn:Math.ceil(c.durMin/st)*st,mx:Math.floor(c.durMax/st)*st}));
  const cand=[];
  for(let di=0;di<7;di++)if(cfg[di].c.avail!=='rest'&&!vac.has(iso(base+di)))cand.push(di);
  return {w,base,st,T,cfg,cand};
}
function tryWeek(S,plan,wi,strict){
  const {base,st,T,cfg,cand}=setup(S,plan,wi);
  const lo=Math.min(S.minWD,cand.length),hi=Math.max(lo,Math.min(S.maxWD,cand.length));
  const n=lo+rnd(hi-lo+1);
  const pool=cand.slice(),ch=[];
  while(ch.length<n){const i=wpick(pool,di=>cfg[di].c.avail==='avoid'?0.25:1);ch.push(pool.splice(i,1)[0]);}
  ch.sort((a,b)=>a-b);
  if(ch.some(di=>cfg[di].mn>cfg[di].mx))return null;
  const sMn=ch.reduce((a,di)=>a+cfg[di].mn,0),sMx=ch.reduce((a,di)=>a+cfg[di].mx,0);
  if(sMn>T||sMx<T)return null;
  const du={};ch.forEach(di=>du[di]=cfg[di].mn);
  let rem=(T-sMn)/st;
  while(rem>0){
    const room=ch.filter(di=>du[di]<cfg[di].mx);if(!room.length)return null;
    const di=room[wpick(room,x=>[0.4,1,2.5][cfg[x].c.tend==null?1:cfg[x].c.tend])];
    du[di]+=st;rem--;
  }
  const before=buildShifts(plan.slice(0,wi)),after=buildShifts(plan.slice(wi+1));
  const prev=before.length?before[before.length-1]:null;
  let prevStreak=0;
  if(prev&&prev.abs===base-1){
    prevStreak=1;
    for(let i=before.length-2;i>=0&&before[i].abs===before[i+1].abs-1;i--)prevStreak++;
  }
  const nxt=after.length?after[0]:null;
  let nextRun=0;
  if(nxt&&nxt.abs===base+7){
    nextRun=1;
    for(let i=1;i<after.length&&after[i].abs===after[i-1].abs+1;i++)nextRun++;
  }
  if(strict&&S.restPref!=='none'){
    const r=[0,1,2,3,4,5,6].map(di=>!ch.includes(di));
    let runs=0,maxRun=0,cr=0;
    r.forEach(x=>{if(x){cr++;maxRun=Math.max(maxRun,cr);}else{if(cr)runs++;cr=0;}});if(cr)runs++;
    const prevRest=before.length>0&&!(prev&&prev.abs===base-1);
    const nextRest=after.length>0&&!(nxt&&nxt.abs===base+7);
    if(S.restPref==='consec'&&runs>1)return null;
    if(S.restPref==='sparse'&&(maxRun>1||(r[0]&&prevRest)||(r[6]&&nextRest)))return null;
  }
  let run=prevStreak;
  for(let di=0;di<7;di++){
    if(ch.includes(di))run++;else run=0;
    if(run>S.maxConsec)return null;
  }
  if(run>0&&run+nextRun>S.maxConsec)return null;
  const days=restDays();
  let prevEnd=prev?prev.abs*1440+prev.e:-1e9;
  for(const di of ch){
    const c=cfg[di].c,fas=S.fasce.filter(f=>c.fasce[f.id]!==false);
    const byF=fas.map(f=>options(S,c,f,du[di]).filter(o=>(base+di)*1440+o.s-prevEnd>=S.restH*60)).filter(a=>a.length);
    if(!byF.length)return null;
    const grp=byF[rnd(byF.length)],o=grp[rnd(grp.length)];
    days[di]={rest:false,s:o.s,e:o.e,note:'',pos:''};
    prevEnd=(base+di)*1440+o.e;
  }
  if(nxt){
    const gap=nxt.abs*1440+nxt.s-prevEnd;
    if(ch.length&&gap<S.restH*60)return null;
  }
  return days;
}
function genWeek(S,plan,wi,tries=800){
  const old=plan[wi].days;
  for(let t=0;t<tries;t++){
    const d=tryWeek(S,plan,wi,t<tries*0.6);
    if(d){d.forEach((x,i)=>{if(old[i]){if(old[i].note)x.note=old[i].note;if(!x.rest&&old[i].pos)x.pos=old[i].pos;}});plan[wi].days=d;return true;}
  }
  return false;
}
function genAll(S,plan){
  const fails=[];
  plan.forEach(w=>{w.days=restDays();});
  plan.forEach((w,wi)=>{if(!genWeek(S,plan,wi))fails.push(wi);});
  return fails;
}
function diagnose(S,plan,wi){
  const {T,cfg,cand}=setup(S,plan,wi);const r=[];
  if(cand.length<S.minWD)r.push('giorni disponibili ('+cand.length+') meno del minimo di giorni lavorati ('+S.minWD+')');
  const best=cand.slice().sort((a,b)=>cfg[b].mx-cfg[a].mx).slice(0,Math.min(S.maxWD,cand.length));
  const mxs=best.reduce((a,di)=>a+cfg[di].mx,0);
  if(mxs<T)r.push('con i massimi di durata si arriva a '+dur(mxs)+', meno delle '+dur(T)+' richieste');
  const mns=cand.slice().sort((a,b)=>cfg[a].mn-cfg[b].mn).slice(0,Math.min(S.minWD,cand.length)).reduce((a,di)=>a+cfg[di].mn,0);
  if(mns>T)r.push('con i minimi di durata servono almeno '+dur(mns)+', più delle '+dur(T)+' richieste');

/* ---------- PDF ---------- */
function makePDF(){
  const W=595,H=842,M=40,pages=[];let ops=[],y=M;
  const enc=s=>{let o='';for(const ch of String(s)){let c=ch.charCodeAt(0);
    if(c===0x2013)c=0x96;else if(c===0x2014)c=0x97;else if(c===0x2019)c=0x92;
    if(c>255||c<32)continue;
    if(c>126)o+='\\'+c.toString(8).padStart(3,'0');else if(ch==='('||ch===')'||ch==='\\')o+='\\'+ch;else o+=ch;}return o;};
  const txt=(x,yy,sz,s,b,col)=>ops.push(`BT /F${b?2:1} ${sz} Tf ${(col||[0,0,0]).join(' ')} rg ${x} ${H-yy} Td (${enc(s)}) Tj ET`);
  const rect=(x,yy,w,h,col)=>ops.push(`${col.join(' ')} rg ${x} ${H-yy-h} ${w} ${h} re f`);
  const box=(x,yy,w,h)=>ops.push(`0 0 0 RG 1 w ${x} ${H-yy-h} ${w} ${h} re S`);
  const ln=(x1,y1,x2,y2,g)=>ops.push(`${g||0} G 0.7 w ${x1} ${H-y1} m ${x2} ${H-y2} l S`);
  const COL={am:[0.96,0.62,0.04],pm:[0.08,0.72,0.65],late:[0.39,0.40,0.95]};
  const GR=[0.45,0.48,0.55];
  const newPage=()=>{if(ops.length)pages.push(ops);ops=[];y=M;};
  const T=w=>w.target==null?S.targetMin:w.target;
  const lbl=d=>d.rest?'Riposo':m2t(d.s)+' - '+m2t(d.e);

  /* Foglio 1: formato originale */
  const RH=18,HH=24;
  plan.forEach(w=>{
    if(y+HH+4+7*RH+14>H-M-18)newPage();
    const b=dayNum(w.start),x1=M,x2=W-M,xc=W-M-60;
    txt(M+8,y+16,12,ddmmyyyy(b)+' - '+ddmmyyyy(b+6),true);
    txt(xc+8,y+12,10,dur(weekTotal(w)),true);txt(xc+8,y+23,10,dur(T(w)),true);y+=HH+4;
    const top=y;
    w.days.forEach((d,di)=>{
      const s=d.rest?'Riposo':DAYN[di]+' '+m2t(d.s)+' - '+m2t(d.e)+(S.code?'  '+S.code:'')+(d.pos?'  '+d.pos:'')+(d.note?'  ('+d.note+')':'');
      txt(x1+6,y+13,10,s,false);
      txt(xc+8,y+13,10,d.rest?'0:00':dur(d.e-d.s));
      if(di)ln(x1,y,x2,y);
      y+=RH;
    });
    box(x1,top,x2-x1,y-top);ln(xc,top,xc,y);
    y+=14;
  });

  /* Foglio 2: tabella riepilogo */
  newPage();
  txt(M,y+14,18,'Panoramica turni',true);y+=30;
  txt(M,y,9,'Turni v'+APP_VERSION,false,GR);y+=18;
  const K=6;
  for(let c0=0;c0<plan.length;c0+=K){
    const ws=plan.slice(c0,c0+K),cw=Math.min(110,(W-2*M-36)/ws.length),tw=36+cw*ws.length,RH2=34;
    if(y+22+7*RH2+24+20>H-M-18)newPage();
    rect(M,y,tw,22,[0.9,0.92,0.96]);
    ws.forEach((w,i)=>txt(M+36+i*cw+6,y+15,10,ddmm(dayNum(w.start))+' - '+ddmm(dayNum(w.start)+6),true));y+=22;
    const top=y;
    for(let di=0;di<7;di++){
      txt(M+6,y+21,10,DAYN[di],true);
      ws.forEach((w,i)=>{
        const d=w.days[di],x=M+36+i*cw;
        if(d.rest){txt(x+6,y+21,10,'Riposo',false,GR);}
        else{rect(x+1,y+1,cw-2,3,COL[cls(d)]);
          txt(x+6,y+17,10,m2t(d.s)+' - '+m2t(d.e),true);
          if(d.pos)txt(x+6,y+29,8,d.pos,false,GR);}
      });
      ln(M,y+RH2,M+tw,y+RH2,0.8);y+=RH2;
    }
    rect(M,y,tw,24,[0.9,0.92,0.96]);txt(M+6,y+16,10,'Ore',true);
    ws.forEach((w,i)=>txt(M+36+i*cw+6,y+16,10,dur(weekTotal(w))+' / '+dur(T(w)),true));y+=24;
    for(let i=0;i<=ws.length;i++)ln(M+36+(i-1)*cw+(i?0:cw),top,M+36+(i-1)*cw+(i?0:cw),y,0.8);
    ln(M,top,M,y,0.8);box(M,top-22,tw,y-top+22);
    y+=20;
  }
  pages.push(ops);
  pages.forEach((p,i)=>{p.push(`BT /F1 8 Tf 0.5 0.53 0.6 rg ${M} 24 Td (${enc('Turni v'+APP_VERSION+'  ·  pagina '+(i+1)+' di '+pages.length)}) Tj ET`);});
  const objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  let n=5;const kids=[];
  pages.forEach(p=>{const st=p.join('\n'),c=n++,pg=n++;
    objs[c]=`<< /Length ${st.length} >>\nstream\n${st}\nendstream`;
    objs[pg]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${c} 0 R >>`;kids.push(pg+' 0 R');});
  objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
  let out='%PDF-1.4\n';const off=[];
  for(let i=1;i<objs.length;i++){off[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n';}
  const xr=out.length;
  out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n'+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return u;
}

  <label class="f chk"><span>Riposo</span><input type="checkbox" id="e_r" ${d.rest?'checked':''}></label>
  <label class="f"><span>Inizio</span><input type="time" id="e_s" step="${S.step*60}" value="${m2t(s)}"></label>
  <label class="f"><span>Fine</span><input type="time" id="e_e" step="${S.step*60}" value="${m2t(e)}"></label>
  <label class="f"><span>Posizione</span><select id="e_p"><option value="">—</option>${(S.positions.includes(d.pos)||!d.pos?S.positions:S.positions.concat([d.pos])).map(p=>`<option ${p===d.pos?'selected':''}>${esc(p)}</option>`).join('')}</select></label>
  <label class="f"><span>Nota</span><input type="text" id="e_n" value="${esc(d.note)}"></label>
  <div class="btns"><button class="pri" data-act="saveedit" data-di="${di}">Salva</button><button data-act="closeedit">Annulla</button></div></div>`;
  $('#sheet').classList.add('on');
}

/* ---------- RENDER ---------- */
function render(){
  $('#view').innerHTML=tab==='plan'?viewPlan():tab==='ov'?viewOverview():tab==='set'?viewSettings():viewExport();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  renderPrint();save();
}
function apply(){
  S.startDate=iso(mondayOf(dayNum(S.startDate)));
  if(S.maxWD<S.minWD)S.maxWD=S.minWD;
  plan=newPlan(S);cur=0;const f=genAll(S,plan);
  tab='plan';render();
  toast(f.length?'Impossibile rispettare tutte le regole in '+f.length+' settimana/e':'Piano generato ✅');
  if(f.length)setTimeout(()=>alert('Settimana '+(f[0]+1)+': '+diagnose(S,plan,f[0])+'.\nAllenta le regole e riprova.'),100);
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act],nav button');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return;}
  const a=t.dataset.act,di=+t.dataset.di;
  switch(a){
    case 'prev':cur=Math.max(0,cur-1);render();break;
    case 'next':cur=Math.min(plan.length-1,cur+1);render();break;
    case 'goto':cur=+t.dataset.wi;tab='plan';render();break;
    case 'edit':openEdit(di);break;
    case 'closeedit':$('#sheet').classList.remove('on');break;
    case 'saveedit':{
      const d=plan[cur].days[di];d.note=$('#e_n').value.trim();d.pos=$('#e_p').value;
      if($('#e_r').checked){d.rest=true;d.s=d.e=null;d.pos='';}
      else{const s=t2m($('#e_s').value),e=t2m($('#e_e').value);
        if(e<=s){toast('La fine deve essere dopo l’inizio');return;}d.rest=false;d.s=s;d.e=e;}
      $('#sheet').classList.remove('on');render();break;}
    case 'regen':
      if(genWeek(S,plan,cur)){toast('Settimana rigenerata ✅');}else toast('Impossibile: '+diagnose(S,plan,cur));
      render();break;
    case 'regenall':{const f=genAll(S,plan);render();toast(f.length?'Alcune settimane non generabili: allenta le regole':'Piano rigenerato ✅');break;}
    case 'apply':apply();break;
    case 'copyday':{const src=S.days[di];S.days.forEach((d,i)=>{if(i!==di)S.days[i]=JSON.parse(JSON.stringify(Object.assign({},src,{avail:d.avail})));});render();toast('Copiato su tutti i giorni (disponibilità esclusa)');break;}
    case 'addfascia':{const id='F'+Date.now().toString(36);S.fasce.push({id,name:'Nuova fascia',mode:'start',from:540,to:720});render();break;}
    case 'delfascia':if(S.fasce.length>1){S.fasce.splice(+t.dataset.i,1);render();}else toast('Serve almeno una fascia');break;
    case 'addvac':{
      const f=$('#vf').value,e=$('#vt').value||f;if(!f){toast('Scegli la data');return;}
      for(let n=dayNum(f);n<=dayNum(e);n++){const x=iso(n);if(!S.vacations.includes(x))S.vacations.push(x);}
      S.vacations.sort();vacFrom=vacTo='';render();break;}
    case 'delvac':S.vacations.splice(+t.dataset.i,1);render();break;
    case 'reset':if(confirm('Ripristinare le impostazioni predefinite? Il piano attuale resta.')){S=defaultSettings(todayIso());render();}break;
    case 'copytxt':copy(asText());break;
    case 'sharetxt':if(navigator.share)navigator.share({text:asText()}).catch(()=>{});else copy(asText());break;
    case 'csv':download('turni.csv','text/csv;charset=utf-8',asCSV());break;
    case 'ics':download('turni.ics','text/calendar',asICS());break;
    case 'print':window.print();break;
    case 'backup':download('turni-backup.json','application/json',JSON.stringify({v:APP_VERSION,S,plan,cur}));break;
    case 'pdf':exportPDF();break;
  }
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='restore'){
    const f=el.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const j=JSON.parse(r.result);S=merge(defaultSettings(todayIso()),j.S);plan=j.plan;cur=0;tab='plan';render();toast('Backup ripristinato ✅');}catch(e){toast('File non valido');}};
    r.readAsText(f);return;
  }
  if(el.dataset.wt){const v=el.value;plan[cur].target=v===''?null:Math.round(parseFloat(v)*60);render();return;}
  if(el.id==='vf'){vacFrom=el.value;return;}if(el.id==='vt'){vacTo=el.value;return;}
  const p=el.dataset.bind;if(!p)return;
  const t=el.dataset.t;let v;
  if(t==='check')v=el.checked;
  else if(t==='int'||t==='selnum')v=parseInt(el.value,10)||0;
  else if(t==='hours')v=Math.round((parseFloat(el.value)||0)*60);
  else if(t==='time')v=t2m(el.value);
  else if(t==='lines')v=el.value.split('\n').map(x=>x.trim()).filter(Boolean);
  else v=el.value;
  if(t==='date'&&v){v=iso(mondayOf(dayNum(v)));el.value=v;}
  set(p,v);save();
  if(p.endsWith('.mode')||/^fasce\.\d+\.name$/.test(p))render();
});
if('serviceWorker' in navigator&&false){}
load();$('#ver').textContent='v'+APP_VERSION;render();

</script></body></html>
